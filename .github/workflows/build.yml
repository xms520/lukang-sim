name: Build LuckinSim IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          # Show available destinations
          xcodebuild -project LuckinSim.xcodeproj -scheme LuckinSim -showdestinations 2>&1 | head -30

      - name: Build for iPhoneOS
        run: |
          xcodebuild build \
            -project LuckinSim.xcodeproj \
            -scheme LuckinSim \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty || true

      - name: Extract and package IPA
        run: |
          # Find the .app in DerivedData
          APP_PATH=$(find DerivedData -name "LuckinSim.app" -type d 2>/dev/null | head -1)
          echo "APP_PATH: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            # Try alternate locations
            APP_PATH=$(find Build -name "LuckinSim.app" -type d 2>/dev/null | head -1)
          fi
          echo "Found: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            # Last resort: search entire workspace
            APP_PATH=$(find . -name "*.app" -type d ! -name "*.dSYM" 2>/dev/null | head -1)
          fi
          echo "Final: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Could not find LuckinSim.app"
            find . -name "*.app" -type d 2>/dev/null | head -5
            exit 1
          fi

          # Clean code signature artifacts
          rm -rf "${APP_PATH}/_CodeSignature"
          find "${APP_PATH}" -name "*.swiftinterface" -delete 2>/dev/null
          find "${APP_PATH}" -name "__debug_*" -delete 2>/dev/null
          find "${APP_PATH}" -name "*debug*" -path "*/dylibs/*" -delete 2>/dev/null

          # Create Payload directory
          mkdir -p Payload
          cp -r "${APP_PATH}" Payload/

          # Create IPA
          zip -r LuckinSim.ipa Payload -x "*.DS_Store"
          rm -rf Payload

          # Create placeholder CodeSignature for TrollStore
          mkdir -p "${APP_PATH}/_CodeSignature"
          echo "{}" > "${APP_PATH}/_CodeSignature/CodeResources"

          # Verify
          file LuckinSim.ipa
          ls -la LuckinSim.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuckinSim
          path: LuckinSim.ipa
