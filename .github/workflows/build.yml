name: Build LuckinSim IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: |
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build for iPhoneOS
        run: |
          xcodebuild build \
            -project LuckinSim.xcodeproj \
            -scheme LuckinSim \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty || true

      - name: Package IPA with full assets
        run: |
          # Find .app in DerivedData
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "LuckinSim.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "LuckinSim.app" -type d | head -1)
          fi
          echo "APP_PATH: $APP_PATH"

          # Copy ALL project resources into the app bundle
          if [ -d "Resources" ]; then
            echo "Copying Resources/ into .app bundle..."
            cp -Rf Resources/* "${APP_PATH}/"
            echo "Copied: $(ls "${APP_PATH}" | head -20)"
          fi

          # Clean code signature artifacts
          rm -rf "${APP_PATH}/_CodeSignature"
          find "${APP_PATH}" -name "*.swiftinterface" -delete 2>/dev/null
          find "${APP_PATH}" -name "__debug_*" -delete 2>/dev/null

          # Create IPA
          mkdir -p Payload
          cp -r "${APP_PATH}" Payload/
          zip -r LuckinSim.ipa Payload -x "*.DS_Store"
          rm -rf Payload

          # Placeholder CodeSignature for TrollStore
          mkdir -p "${APP_PATH}/_CodeSignature"
          echo "{}" > "${APP_PATH}/_CodeSignature/CodeResources"

          # Verify
          file LuckinSim.ipa
          du -sh LuckinSim.ipa
          unzip -l LuckinSim.ipa | tail -5

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LuckinSim
          path: LuckinSim.ipa
